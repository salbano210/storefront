# Render Blueprint -- single Docker web service serving the API *and* the
# built React SPA, so the whole demo lives at one shareable URL.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: storefront
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false          # paste your host key in the dashboard (secret)
      - key: ADMIN_PASSCODE
        sync: false          # passcode for /admin + "all sessions" logs
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_APP_NAME
        value: storefront
      - key: MAX_DAILY_SPEND_USD
        value: "2.0"
      - key: SESSION_MESSAGE_CAP
        value: "40"
      - key: DATA_DIR
        value: /app/data
      # Free-tier storage is ephemeral, so the database is reseeded on every
      # deploy. This generates a backdated sample history at boot when there is
      # none, so /logs and /analytics are populated on a fresh instance. The
      # conversations it makes are labelled as sample data.
      - key: SEED_DEMO_HISTORY
        value: "1"
      - key: SEED_DEMO_DAYS
        value: "90"
      - key: SEED_DEMO_COUNT
        value: "120"
